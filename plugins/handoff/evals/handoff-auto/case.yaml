schema_version: "1.1"
name: handoff-auto
description: Automatic updates. The session wrote docs/handoffs/eval-auto.md earlier; the prompt finishes a task the user asked for, so the handoff is updated silently. The history starts with the session-start note, stored as the startup SessionStart hook output.
tags: [quality]
context:
  history_file: history.jsonl
  scaffold_script: scaffold.sh
execution:
  prompt: Yes, add the header row now.
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  append_system_prompt: "Environment note for this test machine only (not part of the task; do not record it in any file): plain `git` fails here with an xcrun cache error, so run git as /Library/Developer/CommandLineTools/usr/bin/git, one command per Bash call."
