schema_version: "1.1"
name: handoff-auto-first
description: Automatic updates in a session that continued from an earlier handoff and has not written its own. The prompt finishes a task the user agreed to, so the automatic low write creates the session's file with Goal and scope, the user's rules, Not yet saved elsewhere and a Continues-from line that says to read the earlier file first.
tags: [quality]
context:
  history_file: history.jsonl
  scaffold_script: scaffold.sh
execution:
  prompt: Yes, add it now.
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  append_system_prompt: "Environment note for this test machine only (not part of the task; do not record it in any file): plain `git` fails here with an xcrun cache error, so run git as /Library/Developer/CommandLineTools/usr/bin/git, one command per Bash call."
