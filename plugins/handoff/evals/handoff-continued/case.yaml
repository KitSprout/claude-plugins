schema_version: "1.1"
name: handoff-continued
description: A session that continued from an earlier handoff hands off again; done items, answered questions and stale facts must not be carried forward, and the earlier handoff must stay untouched.
tags: [quality]
context:
  history_file: history.jsonl
  scaffold_script: scaffold.sh
execution:
  prompt: /handoff medium docs/handoffs/eval-continued.md
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  append_system_prompt: "Environment note for this test machine only (not part of the task; do not record it in any file): plain `git` fails here with an xcrun cache error, so run git as /Library/Developer/CommandLineTools/usr/bin/git, one command per Bash call."
