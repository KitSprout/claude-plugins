schema_version: "1.1"
name: handoff-gitignored
description: Everything is committed and pushed, but docs/handoffs/ is gitignored. The handoff must say that the handoff file itself is not committed, point to the pushed records instead of copying them, and the closing line must say the file is not committed and pushed.
tags: [quality]
context:
  history_file: history.jsonl
  scaffold_script: scaffold.sh
execution:
  prompt: /handoff medium docs/handoffs/eval-gitignored.md
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  append_system_prompt: "Environment note for this test machine only (not part of the task; do not record it in any file): plain `git` fails here with an xcrun cache error, so run git as /Library/Developer/CommandLineTools/usr/bin/git, one command per Bash call."
