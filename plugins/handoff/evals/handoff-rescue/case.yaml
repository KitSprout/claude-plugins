schema_version: "1.1"
name: handoff-rescue
description: Another session's context is full; this session writes its handoff from the copied transcript.
tags: [quality]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The session next door (id 33333333-4444-4555-8666-777777777777) has a full context: every message answers Prompt is too long, so it can't be used any more. Its transcript is copied to transcripts/dead-session.jsonl. Write a handoff for it so a new session can take over."
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
